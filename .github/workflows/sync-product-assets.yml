name: Sync product assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "scripts/sync-catalog.mjs"
      - "scripts/validate-catalog.mjs"
      - "scripts/import-products.mjs"
      - ".github/workflows/sync-product-assets.yml"
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate catalog
        run: node scripts/validate-catalog.mjs catalog/fremi.json
      - name: Sync all catalog products
        run: node scripts/sync-catalog.mjs catalog/fremi.json
      - name: Select best frontal view
        run: node scripts/select-front-view.mjs catalog/fremi.json
      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/products
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza assets locais do catálogo"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
