<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#f5f4f1">
  <meta name="description" content="Experimente armações Fremi virtualmente usando a câmera do seu dispositivo.">
  <title>Fremi · Provador Virtual</title>
</head>
<body>
<main id="app">
  <section class="shell">
    <header>
      <div class="brand">FREMI</div>
      <h1>Experimente no seu rosto</h1>
      <p>Veja como a armação fica em você, ao vivo.</p>
    </header>
    <div class="stage">
      <div class="mirror-layer">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="overlay3d"></canvas>
      </div>
      <canvas id="overlay"></canvas>
      <div id="status" class="visible">Toque abaixo para iniciar</div>
    </div>
    <button id="start">Experimentar agora</button>
    <div class="actions">
      <button id="switch-camera" class="secondary" hidden>Trocar câmera</button>
      <button id="snapshot" class="secondary" hidden>Salvar foto</button>
    </div>
    <p class="privacy">Sua câmera é processada neste dispositivo. O vídeo não é enviado.</p>
  </section>
</main>
<script type="module" src="/src/main.js"></script>
</body></html>
