<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Virtual Try-On V0.2</title>
</head>
<body>
<main id="app">
  <section class="shell">
    <header><span class="badge">V0.2 · 3D</span><h1>Provador Virtual</h1><p>Protótipo do nosso Try-On Engine.</p></header>
    <div class="stage">
      <div class="mirror-layer">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="overlay3d"></canvas>
      </div>
      <canvas id="overlay"></canvas>
      <div id="status">Câmera ainda não iniciada</div>
    </div>
    <button id="start">Ativar câmera</button>
    <p class="privacy">O vídeo é processado no seu dispositivo.</p>
  </section>
</main>
<script type="module" src="/src/main.js"></script>
</body></html>
